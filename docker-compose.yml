version: "3.9"

# Documenta y reproduce el entorno de base de datos ya usado por el
# proyecto (contenedores postgres_db / pgadmin_ui). Si los contenedores ya
# existen creados a mano, este archivo sirve como referencia; para
# levantarlos desde cero: docker compose up -d

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret123}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Tuning para ~340 cuentas / hasta 100 conexiones concurrentes desde el
    # backend (ver seccion "Escalamiento" del README). El valor por defecto
    # de Postgres (max_connections=100) se queda corto en cuanto el backend
    # corre con varios workers.
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB

  pgadmin_ui:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ui
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123456}
    ports:
      - "8080:80"
    depends_on:
      - postgres_db

volumes:
  postgres_data:

# Documenta y reproduce el entorno de base de datos de ESTE proyecto
# (Sistema de Gestion y Autoevaluacion Docente). Los nombres de
# contenedor/volumen llevan el prefijo "gestion_docente_" a proposito: en
# una maquina de desarrollo con varios proyectos Docker (varios docker
# compose distintos), nombres genericos como "postgres_db" chocan entre
# proyectos -- Docker adopta silenciosamente el primer contenedor que
# encuentre con ese nombre, sin avisar que pertenece a OTRO proyecto (asi
# se descubrio que este proyecto, en esta maquina, habia estado usando el
# Postgres de un proyecto distinto por pura coincidencia de nombres).
#
# Para levantar TU PROPIA instancia dedicada de este proyecto (recomendado
# si tienes el puerto 5432 libre):
#   docker compose up -d
# Si el puerto 5432 ya esta ocupado por otro Postgres tuyo, cambia el
# puerto publicado de abajo (p. ej. "5433:5432") y ajusta DATABASE_URL en
# tu .env acorde.

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: gestion_docente_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestion_docente_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia-esta-contrasena}
      POSTGRES_DB: ${POSTGRES_DB:-gestion_docente}
    ports:
      - "5432:5432"
    volumes:
      - gestion_docente_postgres_data:/var/lib/postgresql/data
    # Tuning para ~340 cuentas / hasta 100 conexiones concurrentes desde el
    # backend (ver seccion "Escalamiento" del README). El valor por defecto
    # de Postgres (max_connections=100) se queda corto en cuanto el backend
    # corre con varios workers.
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB

  pgadmin_ui:
    image: dpage/pgadmin4:latest
    container_name: gestion_docente_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123456}
    ports:
      - "8080:80"
    depends_on:
      - postgres_db

volumes:
  gestion_docente_postgres_data:
